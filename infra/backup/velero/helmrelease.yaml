# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: backup
spec:
  chart:
    spec:
      sourceRef:
        kind: HelmRepository
        name: vmware-tanzu
      chart: velero
      version: 12.0.1
  driftDetection:
    mode: enabled
  interval: 1h
  valuesFrom:
    - kind: ConfigMap
      name: velero-values # Default name, changed using Kustomization