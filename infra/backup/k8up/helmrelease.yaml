# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8up
spec:
  chart:
    spec:
      sourceRef:
        kind: HelmRepository
        name: k8up-io
      chart: k8up
      version: 4.10.0
  # Helm never upgrades CRDs by itself, let Flux handle them
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
  interval: 1h
  values:
    k8up:
      timezone: Europe/Zurich
      # Shared repository for components/backup-k8up: Schedules omit endpoint/bucket.
      # Credentials are NOT set globally, k8up would inject them as plain env values.
      envVars:
        - name: BACKUP_GLOBALS3ENDPOINT
          value: http://garage-infra.object-storage.svc.cluster.local:3900
        - name: BACKUP_GLOBALS3BUCKET
          value: k8up-apps
