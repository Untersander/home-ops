# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
# Cluster-wide kopiur repository used by components/backup-kopiur, in the Backblaze B2 bucket.
# The S3_* values come from Secret backup-s3, see infra/backup/s3.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: backblaze
spec:
  server:
    namespace: backup
  backend:
    s3:
      bucket: ${S3_BUCKET}
      prefix: kopiur/
      # Bare host:port, no scheme
      endpoint: ${S3_HOST}
      region: ${S3_REGION}
      auth:
        secretRef:
          name: backup-s3
          namespace: backup
  encryption:
    passwordSecretRef:
      name: kopiur-cluster-password
      namespace: backup
      key: KOPIA_PASSWORD
  create:
    enabled: true
  # Blob copy of the Garage repository on the first bootstrap, so the history (and the snapshot IDs of
  # the Snapshot CRs) moves along. Not Ready until it landed, and a no-op afterwards.
  seed:
    from:
      backend:
        s3:
          bucket: kopiur-apps
          prefix: cluster/
          endpoint: garage-infra.object-storage.svc.cluster.local:3900
          region: garage
          tls:
            disableTls: true
          auth:
            secretRef:
              name: kopiur-cluster
    sync:
      parallel: 4
  # Only namespaces that opted into backups
  allowedNamespaces:
    selector:
      matchLabels:
        backup.k8s.garden/enabled: "true"
  # Mover Jobs run in the app namespace, kopiur copies the credentials there
  credentialProjection:
    allowed: true
  identityDefaults:
    hostnameExpr: namespace
    usernameExpr: policyName
  maintenance:
    namespace: backup
    schedule:
      quick:
        cron: "0 * * * *"
        jitter: 10m
      full:
        cron: "0 3 * * *"
        jitter: 1h
  parameters:
    epoch:
      minDuration: 1h
  moverDefaults:
    cache:
      # Keep kopia's caches well below the cache volume size
      contentCacheSizeMb: 512
      metadataCacheSizeMb: 1024
  scheduleDefaults:
    timezone: Europe/Zurich
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
# Previous repository in Garage, the source of the seed above
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: garage
spec:
  # Nothing writes here any more, kept for rollback until the backblaze repository proved itself
  suspend: true
  backend:
    s3:
      bucket: kopiur-apps
      # Kept apart from the older per-namespace repositories in this bucket
      prefix: cluster/
      # Bare host:port, no scheme
      endpoint: garage-infra.object-storage.svc.cluster.local:3900
      region: garage
      tls:
        disableTls: true
      auth:
        secretRef:
          name: kopiur-cluster
          namespace: backup
  encryption:
    passwordSecretRef:
      name: kopiur-cluster-password
      namespace: backup
      key: KOPIA_PASSWORD
  create:
    enabled: true
  # Only namespaces that opted into backups
  allowedNamespaces:
    selector:
      matchLabels:
        backup.k8s.garden/enabled: "true"
  # Mover Jobs run in the app namespace, kopiur copies the credentials there
  credentialProjection:
    allowed: true
  identityDefaults:
    hostnameExpr: namespace
    usernameExpr: policyName
  maintenance:
    namespace: backup
    schedule:
      quick:
        cron: "0 * * * *"
        jitter: 10m
      full:
        cron: "0 3 * * *"
        jitter: 1h
  parameters:
    epoch:
      minDuration: 1h
  moverDefaults:
    cache:
      # Keep kopia's caches well below the cache volume size
      contentCacheSizeMb: 512
      metadataCacheSizeMb: 1024
  scheduleDefaults:
    timezone: Europe/Zurich
