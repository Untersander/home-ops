# Backblaze B2 bucket of the kopiur ClusterRepository backblaze. Endpoint and bucket are plain fields there,
# Flux fills them in from this Secret (postBuild.substituteFrom in ../ks.yaml)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backup-s3
spec:
  refreshInterval: 6h0m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password-sdk
  target:
    template:
      data:
        # kopiur mounts the whole secret via envFrom and expects the AWS_* key names
        AWS_ACCESS_KEY_ID: "{{ .keyId }}"
        AWS_SECRET_ACCESS_KEY: "{{ .applicationKey }}"
        # s3-endpoint in 1Password is s3.<region>.backblazeb2.com/<bucket>
        S3_HOST: '{{ .endpoint | splitList "/" | first }}'
        S3_REGION: '{{ .endpoint | splitList "." | rest | first }}'
        S3_BUCKET: "{{ .bucket }}"
  data:
    - secretKey: keyId
      remoteRef:
        key: "/Backblaze B2 backup-k8s-garden/keyID"
    - secretKey: applicationKey
      remoteRef:
        key: "/Backblaze B2 backup-k8s-garden/credential"
    - secretKey: endpoint
      remoteRef:
        key: "/Backblaze B2 backup-k8s-garden/s3-endpoint"
    - secretKey: bucket
      remoteRef:
        key: "/Backblaze B2 backup-k8s-garden/username"
