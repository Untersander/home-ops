# ZFS volume backed up via CSI snapshot, restored automatically from the latest
# kopiur backup when the PVC is created (Restore backup-test from components/backup-kopiur)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-test
  labels:
    backup.k8s.garden/app: backup-test
spec:
  storageClassName: openebs-zfs-shared-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: backup-test
---
# Hostpath volume without CSI snapshots, backed up by the Direct policy, restored manually
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-test-hostpath
  labels:
    backup.k8s.garden/app: backup-test
    backup.k8s.garden/copy-method: Direct
spec:
  storageClassName: openebs-hostpath-ssd
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# Writes a timestamp every minute so every backup contains new data
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-test-writer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backup-test-writer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backup-test-writer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: writer
          image: docker.io/library/busybox:1.37
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                date -Iseconds | tee -a /data/zfs/log.txt >> /data/hostpath/log.txt
                sleep 60
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: zfs
              mountPath: /data/zfs
            - name: hostpath
              mountPath: /data/hostpath
      volumes:
        - name: zfs
          persistentVolumeClaim:
            claimName: backup-test
        - name: hostpath
          persistentVolumeClaim:
            claimName: backup-test-hostpath
