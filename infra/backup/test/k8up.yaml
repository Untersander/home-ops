# Backs up every PVC in this namespace
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: garage-test
spec:
  backend:
    repoPasswordSecretRef:
      name: k8up-repo-password
      key: password
    s3:
      endpoint: http://garage-infra.object-storage.svc.cluster.local:3900
      bucket: k8up-test
      accessKeyIDSecretRef:
        name: k8up-test
        key: access-key-id
      secretAccessKeySecretRef:
        name: k8up-test
        key: secret-access-key
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  backup:
    schedule: "15 * * * *"
    failedJobsHistoryLimit: 2
    successfulJobsHistoryLimit: 2
  check:
    schedule: "0 1 * * 1"
  prune:
    schedule: "0 2 * * *"
    retention:
      keepLast: 5
      keepDaily: 7
