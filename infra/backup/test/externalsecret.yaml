apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-repo-password
spec:
  refreshInterval: 6h0m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password-sdk
  target:
    template:
      data:
        KOPIA_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: "/Kopiur repo encrypt password/credential"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: k8up-repo-password
spec:
  refreshInterval: 6h0m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password-sdk
  target:
    template:
      data:
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: "/K8up repo encrypt password/credential"
