apiVersion: kopiur.home-operations.com/v1alpha1
kind: Repository
metadata:
  name: garage-test
spec:
  backend:
    s3:
      bucket: kopiur-test
      # Bare host:port, no scheme
      endpoint: garage-infra.object-storage.svc.cluster.local:3900
      region: garage
      tls:
        disableTls: true
      auth:
        secretRef:
          name: kopiur-test
  encryption:
    passwordSecretRef:
      name: kopiur-repo-password
      key: KOPIA_PASSWORD
  create:
    enabled: true
  maintenance:
    enabled: true
    schedule:
      quick: { cron: "0 */6 * * *", jitter: 30m }
      full: { cron: "0 3 * * *", jitter: 1h }
      timezone: Europe/Zurich
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: test-zfs
spec:
  repository:
    name: garage-test
  copyMethod: Snapshot
  volumeSnapshotClassName: zfspv-snapclass
  sources:
    - pvc:
        name: test-zfs
  retention:
    keepLatest: 5
    keepDaily: 7
  mover:
    inheritSecurityContextFrom:
      pvcConsumer: {}
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: test-hostpath
spec:
  repository:
    name: garage-test
  copyMethod: Direct
  sources:
    - pvc:
        name: test-hostpath
  retention:
    keepLatest: 5
    keepDaily: 7
  mover:
    inheritSecurityContextFrom:
      pvcConsumer: {}
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: test-zfs-hourly
spec:
  policyRef:
    name: test-zfs
  schedule:
    cron: "0 * * * *"
    runOnCreate: true
    timezone: Europe/Zurich
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: test-hostpath-hourly
spec:
  policyRef:
    name: test-hostpath
  schedule:
    cron: "30 * * * *"
    runOnCreate: true
    timezone: Europe/Zurich
