# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  chartRef:
    kind: OCIRepository
    name: kopiur
  # Helm never upgrades CRDs by itself, let Flux handle them
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
  interval: 30m
  values:
    features:
      # Copy the ClusterRepository credentials into app namespaces for mover Jobs
      credentialProjection:
        enabled: true
