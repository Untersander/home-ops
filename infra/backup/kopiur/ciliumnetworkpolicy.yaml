# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kopiur
  namespace: backup
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: kopiur
  egress:
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kopiur-server
      toPorts:
        - ports:
            - port: "51515"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: object-storage
            app.kubernetes.io/name: garage
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kopiur-server
  namespace: backup
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kopiur-server
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: kopiur
        - matchLabels:
            app.kubernetes.io/managed-by: kopiur
          matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: Exists
      toPorts:
        - ports:
            - port: "51515"
              protocol: TCP
