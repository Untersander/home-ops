# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# external-dns (Cloudflare API) and the vpnk8sgarden-updater cron (ip.wtf, ipify):
# API server and HTTPS to the internet
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-dns
  namespace: external-dns
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
    # Public internet only, no LAN
    - toCIDRSet:
        - cidrGroupRef: public-internet
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
