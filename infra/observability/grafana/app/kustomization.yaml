# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrepository.yaml
  - ./helmrelease.yaml
  - ./externalsecret.yaml
  - ./ciliumnetworkpolicy.yaml
configMapGenerator:
  - name: garage-dashboard
    files:
      - garage.json=./dashboards/garage.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Garage
  - name: smartctl-dashboard
    files:
      - smartctl.json=./dashboards/smartctl.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Hardware
generatorOptions:
  disableNameSuffixHash: true
