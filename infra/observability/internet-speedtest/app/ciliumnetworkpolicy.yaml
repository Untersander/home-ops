# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Scraped by Prometheus (default-deny baseline), runs speedtests against the internet on any port
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: speedtest-exporter
  namespace: observability
spec:
  endpointSelector:
    matchLabels:
      app: speedtest-exporter
  egress:
    # Public internet only, no LAN
    - toCIDRSet:
        - cidrGroupRef: public-internet
