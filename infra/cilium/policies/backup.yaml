# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
# Backup movers in the app namespaces (components/backup-k8up, components/backup-kopiur):
# k8up writes to Garage, kopiur to Backblaze B2 (or the kopia server), and both use the API server.
# Garage and the kopia server allow the matching ingress in their own policies.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: backup-movers-k8up
spec:
  endpointSelector:
    matchLabels:
      k8upjob: "true"
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: object-storage
            app.kubernetes.io/name: garage
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
    - toEntities:
        - kube-apiserver
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: backup-movers-kopiur
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/managed-by: kopiur
  egress:
    - toCIDRSet:
        - cidrGroupRef: public-internet
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Source of the seed of ClusterRepository backblaze
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: object-storage
            app.kubernetes.io/name: garage
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: backup
            app.kubernetes.io/name: kopiur-server
      toPorts:
        - ports:
            - port: "51515"
              protocol: TCP
    - toEntities:
        - kube-apiserver
