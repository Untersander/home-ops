# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
# Every CNPG cluster (instances and initdb/join jobs): the operator reaches the instance manager,
# the instance manager talks to the API server. App access to 5432 lives next to each cluster.
# The Barman Cloud sidecar (components/backup-cnpg) archives WAL and base backups to Garage.
# Replication between instances isn't allowed, all clusters run with instances: 1.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: cnpg
spec:
  endpointSelector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: Exists
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: db
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: object-storage
            app.kubernetes.io/name: garage
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
