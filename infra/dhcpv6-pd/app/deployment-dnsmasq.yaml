---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnsmasq
  namespace: dhcpv6-pd
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels:
      app: dnsmasq
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: dnsmasq
    spec:
      # Serves DHCP/RA on br0 and enp7s0 and writes to the host's nft set inet global iot_allow4
      hostNetwork: true
      containers:
      - name: dnsmasq
        # Alpine's dnsmasq-dnssec-nftset, built in jan/containers (git.k8s.garden, mirrored to github.com/Untersander/containers).
        # Entrypoint: dnsmasq --keep-in-foreground
        image: ghcr.io/untersander/dnsmasq:2.92.0@sha256:5049fa72438b7b0ed183516d68648f93f3dab79574cdbfd30cd0e75eda8d05db
        args: ["--conf-file=/etc/dnsmasq/dnsmasq.conf"]
        securityContext:
          capabilities:
            add: ["NET_ADMIN", "NET_RAW"]
        volumeMounts:
        - mountPath: /etc/dnsmasq
          name: dnsmasq-config
        - mountPath: /var/lib/dnsmasq
          name: dnsmasq-leases
      volumes:
      - configMap:
          name: dnsmasq-config
        name: dnsmasq-config
      - persistentVolumeClaim:
          claimName: dnsmasq-leases
        name: dnsmasq-leases
