# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/garage.rajsingh.info/garagereferencegrant_v1beta1.json
# Allow buckets and keys of the backup namespaces to use this cluster
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageReferenceGrant
metadata:
  name: backup
spec:
  from:
    - kind: GarageBucket
      namespace: backup
    - kind: GarageKey
      namespace: backup-test
  to:
    - kind: GarageCluster
      name: garage-infra
