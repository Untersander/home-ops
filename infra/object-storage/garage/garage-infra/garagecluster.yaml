# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/garage.rajsingh.info/garagecluster_v1beta2.json
apiVersion: garage.rajsingh.info/v1beta2
kind: GarageCluster
metadata:
  name: garage-infra
spec:
  replication:
    factor: 1
  storage:
    replicas: 1
    # affinity:
    #   podAntiAffinity:
    #     requiredDuringSchedulingIgnoredDuringExecution:
    #       - labelSelector:
    #           matchLabels:
    #             garage.rajsingh.info/cluster: garage-infra
    #             garage.rajsingh.info/tier: storage
    #         topologyKey: kubernetes.io/hostname
    metadata:
      # Immutable while replicas are live (operator webhook), only used when the PVC is first created.
      # The PVC was moved to ZFS by hand (task storage:pvc:move), see `kubectl get pvc` for its real class.
      storageClassName: openebs-hostpath-ssd-retain
      size: 1Gi
    data:
      storageClassName: openebs-zfs-shared-retain
      size: 30Gi
  s3Api:
    region: garage
    rootDomain: .s3.k8s.garden
  admin:
    adminTokenSecretRef:
      name: garage-infra-admin-token
      key: admin-token
  # Creates a ServiceMonitor for the admin /metrics endpoint (job="garage")
  monitoring:
    enabled: true
    interval: 30s
