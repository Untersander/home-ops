# Ingress only; egress stays open for LDAP, Valkey and SMTP.
# Apps reach Authelia through the gateway, also for the OIDC back channel (token/userinfo).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authelia
  namespace: auth
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: authelia
  ingress:
    # Portal and OIDC (websecure listener)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "9091"
              protocol: TCP
    # kubelet probes
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "9091"
              protocol: TCP
