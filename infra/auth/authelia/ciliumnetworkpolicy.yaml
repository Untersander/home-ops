# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authelia
  namespace: auth
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: authelia
  ingress:
    # Portal and OIDC (websecure listener)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "9091"
              protocol: TCP
    # kubelet probes
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "9091"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: lldap
      toPorts:
        - ports:
            - port: "3890"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: authelia-valkey
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    # SMTP submission (smtp.protonmail.ch); public internet only, no LAN
    - toCIDRSet:
        - cidrGroupRef: public-internet
      toPorts:
        - ports:
            - port: "587"
              protocol: TCP
