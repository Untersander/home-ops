# Lets forward-auth SecurityPolicies (Envoy ext_authz) in these namespaces call Authelia
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: authelia-ext-authz
  namespace: auth
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: media
  to:
    - group: ""
      kind: Service
      name: authelia
