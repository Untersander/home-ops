# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pihole
  namespace: pihole
spec:
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./infra/pihole/app
  targetNamespace: pihole
  prune: true
  interval: 1h
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
# Kept separate from the app so a broken backup stack never blocks pihole itself
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pihole-backup
  namespace: pihole
spec:
  dependsOn:
    - name: pihole
    - name: backup-repositories
      namespace: backup
  # Backs up the PVCs labeled backup.k8s.garden/app=pihole (pihole-config)
  components:
    - ../../../components/backup-kopiur
    - ../../../components/backup-k8up
  postBuild:
    substitute:
      APP: pihole
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./infra/pihole/backup
  targetNamespace: pihole
  prune: true
  interval: 1h
