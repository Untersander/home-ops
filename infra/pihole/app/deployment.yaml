apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: pihole
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      service: pihole
  template:
    metadata:
      labels:
        service: pihole
    spec:
      containers:
        - env:
            - name: FTLCONF_dns_listeningMode
              value: ALL
            - name: FTLCONF_dns_domain_name
              value: home
            # DHCP and therefore the home names live in the host dnsmasq (infra/dhcpv6-pd), don't answer them locally
            - name: FTLCONF_dns_domain_local
              value: "false"
            - name: FTLCONF_dns_revServers
              value: "true,10.0.0.0/24,10.0.0.1,home;true,10.0.10.0/24,10.0.0.1,home;true,fd00::/64,10.0.0.1,home;true,2a02:169:4a00::/48,10.0.0.1,home"
            - name: FTLCONF_ntp_ipv4_active
              value: "false"
            - name: FTLCONF_ntp_ipv6_active
              value: "false"
            - name: FTLCONF_ntp_sync_active
              value: "false"
            - name: TZ
              value: Europe/Zurich
            - name: FTLCONF_dhcp_active
              value: "false"
          envFrom:
            - secretRef:
                name: pihole-webserver-api-secret
          image: pihole/pihole:2026.10.1
          name: pihole
          ports:
            - containerPort: 53
              protocol: UDP
            - containerPort: 80
              protocol: TCP
            - containerPort: 443
              protocol: TCP
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - SYS_NICE
          volumeMounts:
            - mountPath: /etc/pihole
              name: pihole-config
      resources:
        limits:
          memory: 128Mi
        requests:
          memory: 128Mi
      restartPolicy: Always
      volumes:
        - name: pihole-config
          persistentVolumeClaim:
            claimName: pihole-config
