apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: pihole-l2-announcement
spec:
  serviceSelector:
    matchLabels:
      io.kubernetes.service.namespace: pihole
  interfaces:
    - ^br.*
    - ^eno.*
    - ^enp([89]|10)s0$ # not enp7s0 (IoT) or enp2s0f0np0 (WAN)
    - ^enp2s0f1np1
  externalIPs: false
  loadBalancerIPs: true
