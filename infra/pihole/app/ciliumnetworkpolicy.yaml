# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pihole
  namespace: pihole
spec:
  endpointSelector:
    matchLabels:
      service: pihole
  ingress:
    # LAN clients (real source IP via the L2 announced LoadBalancer)
    - fromCIDRSet:
        - cidr: 10.0.0.0/16
        - cidr: 2a02:169:4a00::/48
        - cidr: fd00::/8
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: wg
            service: wg-manager
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # DHCP discover/request are broadcasts from 0.0.0.0, which is "world"
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "67"
              protocol: UDP
    # Web UI (websecure listener)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
  egress:
    - toCIDRSet:
        - cidrGroupRef: public-internet
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
            - port: "853"
              protocol: TCP
            - port: "443"
              protocol: TCP
    # DHCP offers/acks to clients (broadcast or the LAN)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "68"
              protocol: UDP
