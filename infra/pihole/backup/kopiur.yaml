apiVersion: kopiur.home-operations.com/v1alpha1
kind: Repository
metadata:
  name: apps
spec:
  backend:
    s3:
      bucket: kopiur-apps
      prefix: pihole/
      # Bare host:port, no scheme
      endpoint: garage-infra.object-storage.svc.cluster.local:3900
      region: garage
      tls:
        disableTls: true
      auth:
        secretRef:
          name: kopiur-pihole
  encryption:
    passwordSecretRef:
      name: kopiur-repo-password
      key: KOPIA_PASSWORD
  create:
    enabled: true
  maintenance:
    enabled: true
    schedule:
      quick: { cron: "0 */6 * * *", jitter: 30m }
      full: { cron: "0 5 * * *", jitter: 30m }
      timezone: Europe/Zurich
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: pihole-config
spec:
  repository:
    name: apps
  # openebs-hostpath has no CSI snapshots, read the live volume
  copyMethod: Direct
  sources:
    - pvc:
        name: pihole-config
  files:
    # Defaults plus the live query history database, which can be copied mid-write
    ignoreRules:
      - /lost+found
      - System Volume Information
      - $RECYCLE.BIN
      - "@eaDir"
      - .snapshot
      - /pihole-FTL.db*
  retention:
    keepDaily: 14
    keepWeekly: 8
  mover:
    # pihole-FTL drops to uid/gid 1000, which owns all files in /etc/pihole.
    # The pod spec pins no runAsUser, so it can't be inherited.
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
    # Match the volume's group instead of the mover image default (65532),
    # so the identity recorded on the snapshot is 1000:1000 for restores
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: pihole-config-daily
spec:
  policyRef:
    name: pihole-config
  schedule:
    cron: "0 3 * * *"
    runOnCreate: true
    timezone: Europe/Zurich
