apiVersion: v1
kind: ConfigMap
metadata:
  name: nft-config
  namespace: nftables
data:
  firewall.nft: |
    destroy table inet global

    define DEV_PRIVATE = br0
    define DEV_WORLD = enp2s0f0np0
    define NET_PRIVATE = 10.0.0.0/16
    define DEV_IOT = enp7s0
    define NET_PODS = 10.244.0.0/16

    table inet global {

        # IPs of the domains allowed for the IoT network, filled by dnsmasq (infra/dhcpv6-pd/app/dnsmasq.yaml)
        set iot_allow4 {
            type ipv4_addr
            flags timeout
            timeout 1d
        }

        chain inbound_world {
            # accepting ping (icmp-echo-request) for diagnostic purposes.
            # However, it also lets probes discover this host is alive.
            # This sample accepts them within a certain rate limit:
            #
            icmp type echo-request limit rate 5/second burst 4 packets accept
            ip protocol igmp accept
            icmpv6 type echo-request limit rate 5/second burst 4 packets accept
            icmpv6 type {mld-listener-query,nd-router-solicit, nd-router-advert,nd-neighbor-solicit,nd-neighbor-advert,nd-redirect,router-renumbering,ind-neighbor-solicit,ind-neighbor-advert} accept
            # DHCPv6-PD
            udp dport 546 accept

            # allow example
            # ip protocol . th dport vmap { udp . 51820 : accept, udp . 5201 : accept, tcp . 5201 : accept}
            drop
        }

        chain inbound_iot {
            icmp type echo-request limit rate 5/second burst 4 packets accept
            # DHCP and DNS via dnsmasq, nothing else on the node (k8s API, Talos API, ...)
            udp dport 67 accept
            ip daddr 10.0.10.1 meta l4proto { tcp, udp } th dport 53 accept
            drop
        }

        chain inbound_private {
            # dnsmasq on the br0 addresses (v4 and v6) is the IoT allowlist plus local names for Pi-hole,
            # LAN clients use Pi-hole. Pi-hole's queries come from its pod, not via br0, and LoadBalancer
            # traffic (10.0.0.5) is DNATed to the pod by Cilium before it gets here
            meta l4proto { tcp, udp } th dport 53 drop
            accept
        }

        chain inbound {
            type filter hook input priority filter; policy accept;

            # Allow traffic from established and related packets, drop invalid
            ct state vmap { established : accept, related : accept, invalid : drop }

            # allow loopback traffic, anything else jump to chain for further evaluation
            iifname vmap { lo : accept, $DEV_WORLD : jump inbound_world, $DEV_PRIVATE : jump inbound_private, $DEV_IOT : jump inbound_iot }

        }

        chain forward_world {
            # igmp is used for multicast routing, so we need to allow it to pass through the firewall
            ip protocol igmp accept

            # allow IPv6 control and error messages needed by forwarded clients
            icmpv6 type {destination-unreachable,packet-too-big,time-exceeded,parameter-problem} accept

            # allow example
            # ip protocol . th dport vmap { udp . 51820 : accept, udp . 5201 : accept, tcp . 5201 : accept}
            ip protocol . th dport vmap { udp . 51820 : accept}
            # Project Zomboid Server (hostPort, apps/games/zomboid)
            ip protocol . th dport vmap { udp . 16261 : accept, udp . 16262 : accept}
            drop
        }

        chain forward_iot {
            # Cilium already rewrote LoadBalancer IPs (Jellyfin via envoy at 10.0.0.20) to pod IPs
            ip daddr $NET_PODS accept
            # Internet only to IPs of allowed domains, no LAN
            oifname $DEV_WORLD ip daddr @iot_allow4 accept
            drop
        }

        chain forward {
            type filter hook forward priority filter; policy accept;

            # Allow traffic from established and related packets, drop invalid
            ct state vmap { established : accept, related : accept, invalid : drop }

            # connections from the internal net to the internet or to other
            # internal nets are allowed
            iifname vmap { lo : accept, $DEV_WORLD : jump forward_world, $DEV_PRIVATE : accept, $DEV_IOT : jump forward_iot }

        }

        chain postrouting {
            type nat hook postrouting priority srcnat; policy accept;
            # masquerade private IP addresses
            meta nfproto ipv4 ip saddr $NET_PRIVATE oifname $DEV_WORLD masquerade
        }
    }