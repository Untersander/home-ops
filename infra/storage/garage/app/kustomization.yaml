---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: storage
resources:
  - ./ocirepository.yaml
  - ./es.yaml
  - ./helmrelease.yaml
  - ./pvc.yaml
configMapGenerator:
  - name: garage-configmap
    files:
      - garage.toml=./resources/garage.toml
generatorOptions:
  disableNameSuffixHash: true