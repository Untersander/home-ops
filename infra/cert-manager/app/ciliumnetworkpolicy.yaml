# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# All components talk to the API server; webhook calls come from it via the default-deny baseline
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Controller: ACME and the Cloudflare API, plus DNS-01 propagation checks against the authoritative nameservers
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager-controller
  namespace: cert-manager
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
      app.kubernetes.io/component: controller
  egress:
    # Public internet only, no LAN
    - toCIDRSet:
        - cidrGroupRef: public-internet
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "53"
              protocol: ANY
