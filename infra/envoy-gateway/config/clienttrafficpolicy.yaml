apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: envoy-gateway
  namespace: envoy-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-gateway
  # Generous timeouts for long-running requests, such as file uploads or downloads needed by e.g. immich
  timeout:
    http:
      requestReceivedTimeout: 600s
      idleTimeout: 600s
      streamIdleTimeout: 600s
  # Keep %2F as sent. The default redirects to the decoded path, which breaks Forgejo API calls for
  # branches with a slash: Renovate gets a 404 for renovate/* and aborts the run
  path:
    escapedSlashesAction: KeepUnchanged
