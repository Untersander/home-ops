apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: envoy-gateway-lb-l2-policy
  namespace: envoy-gateway
spec:
  interfaces:
  - ^br.*
  - ^eno.*
  - ^enp([89]|10)s0$ # not enp7s0 (IoT) or enp2s0f0np0 (WAN)
  - ^enp2s0f1np1
  loadBalancerIPs: true
  serviceSelector:
    matchExpressions:
    - key: io.kubernetes.service.namespace
      operator: In
      values:
      - envoy-gateway