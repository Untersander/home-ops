# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paperless-ngx-valkey
  namespace: paperless-ngx
spec:
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./apps/paperless-ngx/valkey
  targetNamespace: paperless-ngx
  prune: true
  interval: 1h
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paperless-ngx-db
  namespace: paperless-ngx
spec:
  components:
    - ../../../components/backup-kopiur
    - ../../../components/backup-k8up
  postBuild:
    substitute:
      APP: paperless-ngx
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./apps/paperless-ngx/db
  targetNamespace: paperless-ngx
  prune: true
  interval: 1h
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paperless-ngx-app
  namespace: paperless-ngx
spec:
  dependsOn:
    - name: paperless-ngx-db
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./apps/paperless-ngx/paperless-ngx
  targetNamespace: paperless-ngx
  prune: true
  interval: 1h
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paperless-ngx-samba
  namespace: paperless-ngx
spec:
  # paperless-ngx-app owns the paperless-media PVC the share mounts
  dependsOn:
    - name: paperless-ngx-app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./apps/paperless-ngx/samba
  targetNamespace: paperless-ngx
  prune: true
  interval: 1h
