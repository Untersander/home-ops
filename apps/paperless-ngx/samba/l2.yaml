apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: paperless-samba-l2-policy
spec:
  interfaces:
  - ^br.*
  - ^eno.*
  - ^enp.*s0
  - ^enp2s0f1np1
  loadBalancerIPs: true
  serviceSelector:
    matchExpressions:
    - key: io.kubernetes.service.namespace
      operator: In
      values:
      - paperless-ngx
