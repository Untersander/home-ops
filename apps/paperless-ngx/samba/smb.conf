[global]
	server string = paperless
	server role = standalone server
	security = user
	server min protocol = SMB2
	disable netbios = yes
	smb ports = 445

	# Guest-only share: unknown users map to the "paperless" account (UID/GID 1000, created by samba.sh)
	map to guest = Bad User
	guest account = paperless

	# LAN only; real client IPs arrive via the LoadBalancer (externalTrafficPolicy: Local)
	hosts allow = 10.0.0.0/16
	hosts deny = 0.0.0.0/0

	# disable printing services
	load printers = no
	printing = bsd
	printcap name = /dev/null
	disable spoolss = yes

	# macOS compatibility
	vfs objects = catia fruit streams_xattr
	fruit:metadata = stream
	fruit:encoding = native

	mangled names = no
	unix charset = UTF-8

[consume]
	path = /shared
	comment = Paperless consume folder
	browseable = yes
	read only = no
	guest ok = yes
	guest only = yes
	# Every client writes as the owner of the paperless files, like the NFS All_Squash export
	force user = paperless
	force group = paperless
	create mask = 0664
	directory mask = 0775
	# Keep macOS/Windows metadata files away from the paperless consumer
	veto files = /._*/.DS_Store/Thumbs.db/desktop.ini/
	delete veto files = yes
