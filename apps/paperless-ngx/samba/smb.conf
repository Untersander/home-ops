[global]
	server string = paperless
	# The default (pod hostname) exceeds the 15 char limit and changes on every rollout
	netbios name = paperless
	server role = standalone server
	security = user
	server min protocol = SMB2
	disable netbios = yes
	smb ports = 445

	idmap config * : backend = tdb
	idmap config * : range = 3000-7999

	# ScanSnap authenticates with NTLMv2 user/password; no guest access.
	# LAN-only access is enforced by the CiliumNetworkPolicy (hosts allow would reject the kubelet probes)
	map to guest = Never

	# disable printing services
	load printers = no
	printing = bsd
	printcap name = /dev/null
	disable spoolss = yes

	# macOS compatibility
	vfs objects = catia fruit streams_xattr
	fruit:metadata = stream
	fruit:encoding = native

	mangled names = no
	unix charset = UTF-8

[consume]
	path = /shared
	comment = Paperless consume folder
	browseable = yes
	read only = no
	valid users = paperless
	# Every client writes as the owner of the paperless files, like the NFS All_Squash export.
	# No force group: samba.sh names the GID 1000 group "smb", and force user already uses it as primary group
	force user = paperless
	create mask = 0664
	directory mask = 0775
	# Keep macOS/Windows metadata files away from the paperless consumer
	veto files = /._*/.DS_Store/Thumbs.db/desktop.ini/
	delete veto files = yes
