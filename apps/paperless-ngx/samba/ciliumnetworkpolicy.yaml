apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: paperless-samba
  namespace: paperless-ngx
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: paperless-samba
  ingress:
    # LAN clients only (real source IP via externalTrafficPolicy: Local)
    - fromCIDR:
        - 10.0.0.0/16
      toPorts:
        - ports:
            - port: "445"
              protocol: TCP
    # kubelet probes
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "445"
              protocol: TCP
