# The LAN share exports the whole pool root: media/ (Jellyfin) and paperless/
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-zpool
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  capacity:
    storage: 4Ti
  volumeMode: Filesystem
  accessModes:
  - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /var/mnt/zpool
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - cp-0
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zpool
  namespace: nfs
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 4Ti
  storageClassName: "local-storage"
  volumeName: nfs-zpool
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-ganesha-recovery
  namespace: nfs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: openebs-hostpath-ssd
