NFS_Core_Param {
	NFS_Port = 2049;
	Protocols = 4;
	Fsid_Device = true;
}

NFSV4 {
	RecoveryBackend = fs_ng;
	RecoveryRoot = /recovery;
	Lease_Lifetime = 40;
	Grace_Period = 50;
}

EXPORT_DEFAULTS {
	SecType = sys;
	Protocols = 4;
	Transports = TCP;
}

EXPORT {
	Export_Id = 0;
	Path = /data;
	Pseudo = /;
	# Export id 0 must set Protocols itself; EXPORT_DEFAULTS don't count
	Protocols = 4;
	Transports = TCP;
	SecType = sys;

	Access_Type = None;
	# Every client user reads and writes as the owner of the media files
	Squash = All_Squash;
	Anonymous_Uid = 1000;
	Anonymous_Gid = 1000;

	FSAL {
		Name = VFS;
	}

	# Real client IPs arrive via the LoadBalancer (externalTrafficPolicy: Local);
	# the CiliumNetworkPolicy narrows 10.244.0.0/24 to the wg-manager pod
	CLIENT {
		Clients = 10.0.0.0/16, 10.244.0.0/24;
		Access_Type = RW;
		Protocols = 4;
	}
}

LOG {
	Default_Log_Level = EVENT;
}
