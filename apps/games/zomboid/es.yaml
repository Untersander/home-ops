apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zomboid
  namespace: games
spec:
  refreshInterval: 6h0m0s
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  target:
    template:
      type: generic
      data:
        admin-password: "{{ .adminPassword }}"
        server-password: "{{ .serverPassword }}"
  data:
    - secretKey: adminPassword
      remoteRef:
        key: "Project Zomboid/credential"
    - secretKey: serverPassword
      remoteRef:
        key: "Project Zomboid/server-password"
