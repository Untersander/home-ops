# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Server: web/API through the gateway, talks to the database, Valkey, machine learning
# and the internet (version check, reverse geocoding data)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich-server
  namespace: immich
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: server
      app.kubernetes.io/instance: immich
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "2283"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: immich-database
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: valkey
            app.kubernetes.io/instance: immich
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: machine-learning
            app.kubernetes.io/instance: immich
      toPorts:
        - ports:
            - port: "3003"
              protocol: TCP
    # Public internet only, no LAN
    - toCIDRSet:
        - cidrGroupRef: public-internet
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Machine learning: only the server calls it, downloads models from Hugging Face
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich-machine-learning
  namespace: immich
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: machine-learning
      app.kubernetes.io/instance: immich
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: server
            app.kubernetes.io/instance: immich
      toPorts:
        - ports:
            - port: "3003"
              protocol: TCP
  egress:
    # Public internet only, no LAN
    - toCIDRSet:
        - cidrGroupRef: public-internet
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Valkey: reachable by the server alone, no egress beyond DNS
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich-valkey
  namespace: immich
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: valkey
      app.kubernetes.io/instance: immich
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: server
            app.kubernetes.io/instance: immich
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Database (apps/immich/db, not reconciled by Flux): app access only,
# operator access and API server egress come from infra/cilium/policies/cnpg.yaml
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich-database
  namespace: immich
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: immich-database
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: server
            app.kubernetes.io/instance: immich
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
