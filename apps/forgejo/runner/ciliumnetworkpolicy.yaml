# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: forgejo-runner
  namespace: forgejo
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner
      app.kubernetes.io/instance: forgejo-runner
  ingress:
    # Cache proxy (cache.proxy_port)
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/managed-by: forgejo-runner
      toPorts:
        - ports:
            - port: "8089"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # git.k8s.garden (envoy listens on 10443 for the 443 listener)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    # Public internet only, no LAN
    - toCIDRSet:
        - cidrGroupRef: public-internet
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: forgejo-runner-jobs
  namespace: forgejo
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/managed-by: forgejo-runner
  # Steps are run via the API server (pods/exec), not over the pod network
  ingress:
    - {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: forgejo-runner
            app.kubernetes.io/instance: forgejo-runner
      toPorts:
        - ports:
            - port: "8089"
              protocol: TCP
    # Public internet only, no LAN
    - toCIDRSet:
        - cidrGroupRef: public-internet
