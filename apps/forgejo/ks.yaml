# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-db
  namespace: forgejo
spec:
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./apps/forgejo/db
  targetNamespace: forgejo
  prune: true
  interval: 1h
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-app
  namespace: forgejo
spec:
  components:
    - ../../../components/backup-kopiur
  postBuild:
    substitute:
      APP: forgejo
  # kopiur's webhook rejects policies while the ClusterRepository doesn't exist,
  # and the auto-restore PVC must not be created before the repository is there
  dependsOn:
    - name: forgejo-db
    - name: backup-repositories
      namespace: backup
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./apps/forgejo/forgejo
  targetNamespace: forgejo
  prune: true
  interval: 1h
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-runner
  namespace: forgejo
spec:
  # forgejo-app registers the runner and owns the forgejo-runner secret
  dependsOn:
    - name: forgejo-app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./apps/forgejo/runner
  targetNamespace: forgejo
  prune: true
  interval: 1h
