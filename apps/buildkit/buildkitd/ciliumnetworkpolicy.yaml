# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: buildkitd
  namespace: buildkit
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: buildkitd
  ingress:
    # Forgejo Actions job pods (apps/forgejo/runner)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: forgejo
            app.kubernetes.io/managed-by: forgejo-runner
      toPorts:
        - ports:
            - port: "1234"
              protocol: TCP
  egress:
    # Pushes to git.k8s.garden (envoy listens on 10443 for the 443 listener)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
    # Base images, packages, ghcr.io. Public internet only, no LAN
    - toCIDRSet:
        - cidrGroupRef: public-internet
