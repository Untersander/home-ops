# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./ciliumnetworkpolicy.yaml
  - ./pvc.yaml
# Having values in a separate `values.yaml` is more comfortable.
configMapGenerator:
  - name: atuin-values
    namespace: atuin
    files:
      - values.yaml=./values.yaml
configurations:
  - nameReference.yaml
