apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opencloud-app
  namespace: cloud
spec:
  refreshInterval: 6h0m0s
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  target:
    template:
      type: generic
      data:
        admin-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: "OpenCloud/password"
