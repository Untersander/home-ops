# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Web UI through the gateway; the services call the built-in IDP via OC_URL, i.e. through the gateway as well
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: opencloud
  namespace: cloud
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: opencloud
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "9200"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
