# Generated by `opencloud init` on first start (opencloud.yaml with JWT/machine-auth secrets)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opencloud-config
  namespace: cloud
  labels:
    backup.k8s.garden/app: opencloud
spec:
  storageClassName: openebs-zfs-shared-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: opencloud
---
# Files, metadata (decomposedfs), IDM (LDAP), NATS and search index
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opencloud-data
  namespace: cloud
  labels:
    backup.k8s.garden/app: opencloud
spec:
  storageClassName: openebs-zfs-shared-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 200Gi
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: opencloud
