---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: filebrowser
  namespace: cloud
spec:
  chartRef:
    kind: OCIRepository
    name: filebrowser
  driftDetection:
    mode: enabled
  interval: 1h
  values:
    controllers:
      filebrowser:
        containers:
          app:
            image:
              repository: docker.io/filebrowser/filebrowser
              tag: v2.59.0@sha256:6e950e90bae0c53c27f4be6eeeb88e4b9cffc1f9be05ca2a0c09e74663ae595d
            env:
              FB_DATABASE: /config/filebrowser.db
              FB_LOG: stdout
              FB_NOAUTH: false
              FB_ROOT: /data
              TZ: Europe/Zurich
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &browserPort 80
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 15m
                memory: 512M
              limits:
                memory: 512M
    defaultPodOptions:
      securityContext:
        seccompProfile: { type: RuntimeDefault }
    service:
      filebrowser:
        controller: filebrowser
        ipFamilyPolicy: PreferDualStack
        ports:
          http:
            port: *browserPort
    route:
      filebrowser:
        hostnames: ["cloud.k8s.garden"]
        parentRefs:
          - name: traefik-gateway
            namespace: traefik
            sectionName: websecure
        rules:
          - backendRefs:
              - identifier: filebrowser
                port: *browserPort
    persistence:
      config:
        existingClaim: filebrowser
      data:
        existingClaim: media-pvc