# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dawarich
  namespace: dawarich
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: dawarich
      app.kubernetes.io/instance: dawarich
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # kubelet probes
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: dawarich-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: dawarich-valkey
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    # auth.k8s.garden (OIDC discovery/token/userinfo back channel)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
    # Public internet only, no LAN (version check)
    - toCIDRSet:
        - cidrGroupRef: public-internet
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
