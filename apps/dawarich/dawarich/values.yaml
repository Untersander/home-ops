controllers:
  dawarich:
    annotations:
      reloader.stakater.com/auto: "true"
    # Storage on a RWO volume
    strategy: Recreate
    containers:
      app:
        image:
          repository: docker.io/freikin/dawarich
          tag: 1.19.0
        # Same as upstream's compose file: the entrypoint syncs the static assets into public/,
        # runs the migrations and seeds, then starts the server (Sidekiq runs embedded)
        command: ["web-entrypoint.sh"]
        args: ["bin/rails", "server", "-p", "3000", "-b", "::"]
        env:
          TZ: Europe/Zurich
          TIME_ZONE: Europe/Zurich
          RAILS_ENV: production
          RAILS_LOG_TO_STDOUT: "true"
          SELF_HOSTED: "true"
          # Bundler wants a writable home, the root filesystem is read-only
          HOME: /tmp
          APPLICATION_HOSTS: dawarich.k8s.garden
          # Also enables force_ssl, Envoy sends X-Forwarded-Proto: https
          APPLICATION_PROTOCOL: https
          DOMAIN: dawarich.k8s.garden
          DATABASE_HOST: dawarich-db-rw.dawarich.svc.cluster.local
          DATABASE_PORT:
            valueFrom:
              secretKeyRef:
                name: dawarich-db-app
                key: port
          DATABASE_NAME:
            valueFrom:
              secretKeyRef:
                name: dawarich-db-app
                key: dbname
          DATABASE_USERNAME:
            valueFrom:
              secretKeyRef:
                name: dawarich-db-app
                key: username
          DATABASE_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: dawarich-db-app
                key: password
          REDIS_URL: redis://dawarich-valkey:6379
          # Jobs run in the web process, no separate Sidekiq deployment
          SIDEKIQ_EMBEDDED: "true"
          WEB_CONCURRENCY: "0"
          BACKGROUND_PROCESSING_CONCURRENCY: "2"
          # No reverse geocoding provider yet, no coordinates leave the cluster
          STORE_GEODATA: "true"
          SECRET_KEY_BASE:
            valueFrom:
              secretKeyRef:
                name: dawarich-app
                key: secret-key-base
          # Login with Authelia, see infra/auth/README.md
          OIDC_ISSUER: https://auth.k8s.garden
          OIDC_CLIENT_ID: dawarich
          OIDC_CLIENT_SECRET:
            valueFrom:
              secretKeyRef:
                name: dawarich-oidc
                key: secret
          OIDC_REDIRECT_URI: https://dawarich.k8s.garden/users/auth/openid_connect/callback
          OIDC_PROVIDER_NAME: Authelia
          OIDC_PKCE_ENABLED: "true"
          OIDC_AUTO_REGISTER: "true"
          ALLOW_EMAIL_PASSWORD_REGISTRATION: "false"
        probes:
          liveness: &probe
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/v1/health
                port: 3000
                # Otherwise force_ssl redirects the probe to https
                httpHeaders:
                  - name: X-Forwarded-Proto
                    value: https
          readiness: *probe
          # Migrations run before the server listens
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/v1/health
                port: 3000
                httpHeaders:
                  - name: X-Forwarded-Proto
                    value: https
              failureThreshold: 60
              periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 50m
            memory: 768Mi

defaultPodOptions:
  securityContext:
    # Started as non-root, the entrypoint skips its chown and gosu (PUID/PGID) step
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: { type: RuntimeDefault }

service:
  dawarich:
    controller: dawarich
    ports:
      http:
        port: 3000

route:
  dawarich:
    hostnames: ["dawarich.k8s.garden"]
    parentRefs:
      - name: envoy-gateway
        namespace: envoy-gateway
        sectionName: websecure
    rules:
      - backendRefs:
          - identifier: dawarich
            port: 3000

persistence:
  storage:
    existingClaim: dawarich-storage
    globalMounts:
      - path: /var/app/storage
  # Writable paths on the read-only root filesystem; public/ is refilled from the image on every start
  scratch:
    type: emptyDir
    globalMounts:
      - path: /var/app/public
        subPath: public
      - path: /var/app/tmp
        subPath: tmp
      - path: /var/app/log
        subPath: log
      - path: /tmp
        subPath: system-tmp
