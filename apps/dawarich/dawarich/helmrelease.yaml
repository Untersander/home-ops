# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dawarich
  namespace: dawarich
spec:
  chartRef:
    kind: OCIRepository
    name: dawarich
  driftDetection:
    mode: enabled
  interval: 1h
  valuesFrom:
    - kind: ConfigMap
      name: dawarich-values # Default name, changed using Kustomization
