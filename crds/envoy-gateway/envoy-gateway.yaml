# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/gitrepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: envoy-gateway-crds
  namespace: kube-system
spec:
  url: https://github.com/envoyproxy/gateway
  ref:
    tag: v1.9.1
  ignore: |-
    /*
    !/charts/gateway-helm/charts/crds/crds/generated
  interval: 24h
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway-crds
  namespace: kube-system
spec:
  sourceRef:
    kind: GitRepository
    name: envoy-gateway-crds
  path: ./charts/gateway-helm/charts/crds/crds/generated
  prune: false
  interval: 3m
