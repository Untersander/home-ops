machine:
  certSANs:
    - cp-0.k8s.garden
    - cp-0.local
    - cp-0
cluster:
  etcd:
    # listenSubnets defaults to advertisedSubnets if not set explicitly
    advertisedSubnets:
      - 10.0.0.0/24
      - fd00::/64
---
apiVersion: v1alpha1
kind: KubeClusterConfig
# Endpoint is the canonical controlplane endpoint, which can be an IP address or a DNS hostname.
endpoint: https://10.0.0.1:6443
---
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  # The `validSubnets` field configures the networks to pick kubelet node IP from.
  validSubnets:
    - 10.0.0.0/24
    - fd00::/64
---
apiVersion: v1alpha1
kind: KubeTalosAPIAccessConfig
allowedKubernetesNamespaces:
  - system-upgrade # tuppr
allowedRoles:
  - os:admin
---
# dnsmasq (infra/dhcpv6-pd) excludes lo because of the host DNS addresses
apiVersion: v1alpha1
kind: ResolverConfig
hostDNS:
  enabled: true
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: disk.size <= 300u * GB && disk.model.startsWith("Samsung SSD")
  wipe: true
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: off
hostname: cp-0
---
apiVersion: v1alpha1
kind: LinkConfig
name: enp2s0f0np0
up: true
---
apiVersion: v1alpha1
kind: DHCPv4Config
name: enp2s0f0np0
ignoreHostname: true
---
apiVersion: v1alpha1
kind: BridgeConfig
name: br0
links:
  - eno1
  - enp9s0
  - enp8s0
  - enp10s0
  - enp2s0f1np1
stp:
  enabled: false
vlan:
  filtering: false
up: true
addresses:
  - address: 10.0.0.1/24
  - address: fd00::1/64
routes:
  - destination: 10.0.0.0/24
---
# IoT network (Samsung TV), cabled to the Zyxel LAN1 which is in its own interface group with the Home-IoT SSID.
# The Zyxel firmware can't bridge an SSID onto a tagged VLAN, hence the separate port.
# IPv4 only: dnsmasq only sends RAs on br0. Firewalled in infra/nftables/app/config.yaml
apiVersion: v1alpha1
kind: LinkConfig
name: enp7s0
up: true
addresses:
  - address: 10.0.10.1/24
