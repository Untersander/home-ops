apiVersion: v1alpha1
kind: KubeClusterConfig
clusterName: K8s-Garden # Configures the cluster's name.
---
apiVersion: v1alpha1
kind: KubeNetworkConfig
# The pod subnet CIDR.
podSubnets:
  - 10.244.0.0/16
  - fdee::/80
# The service subnet CIDR.
serviceSubnets:
  - 10.96.0.0/12
  - fdee:1::/108
nodeCIDRMaskSizeIPv6: 96
---
# Disable for cilium
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
# Disable kube-proxy deployment on cluster bootstrap, replaced by cilium.
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
# Allow scheduling on the control plane: drop the default NoSchedule taint.
apiVersion: v1alpha1
kind: KubeNodeConfig
taints:
  $patch: delete
---
apiVersion: v1alpha1
kind: KubeletConfig
extraArgs:
  rotate-server-certificates: "true"
---
apiVersion: v1alpha1
kind: SysctlConfig
params:
  net.ipv4.ip_forward: "1"
  net.ipv6.conf.all.forwarding: "1"
---
# The installer image is set by the Taskfile (factory schematic), the disk per node.
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  wipe: true
